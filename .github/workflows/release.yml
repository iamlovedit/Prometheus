name: Release Prometheus

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        shell: pwsh
        run: |
          $match = [regex]::Match($env:VERSION, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $match.Success) {
            throw "Release tag must use the form v1.2.3. Received: $env:VERSION"
          }

          $releaseVersion = $match.Groups['version'].Value
          [xml]$props = Get-Content -Raw -LiteralPath 'Directory.Build.props'
          $projectVersion = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($projectVersion -ne $releaseVersion) {
            throw "Tag version $releaseVersion does not match Directory.Build.props version $projectVersion."
          }

          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore and test
        run: |
          dotnet restore src/Prometheus.slnx
          dotnet test src/Prometheus.slnx -c Release --no-restore

      - name: Publish desktop
        shell: pwsh
        run: |
          dotnet publish src/Prometheus/Prometheus.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false `
            -p:EnableAutomaticUpdatePublishing=false -o artifacts/desktop

      - name: Create release package
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null

          $packageName = "Prometheus-$env:RELEASE_VERSION-win-x64.zip"
          $packagePath = Join-Path $outputDirectory $packageName
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts/desktop'),
            $packagePath,
            [IO.Compression.CompressionLevel]::Optimal,
            $false)

          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
          Write-Host "Created $packageName"
          Write-Host "SHA256: $hash"
          "PACKAGE_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:VERSION --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference

          if ($releaseExists) {
            gh release upload $env:VERSION $env:PACKAGE_PATH `
              --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $env:VERSION $env:PACKAGE_PATH `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "Prometheus $env:RELEASE_VERSION" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish GitHub Release $env:VERSION."
          }
