name: Release Prometheus

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        shell: pwsh
        run: |
          $match = [regex]::Match($env:VERSION, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $match.Success) {
            throw "Release tag must use the form v1.2.3. Received: $env:VERSION"
          }

          $releaseVersion = $match.Groups['version'].Value
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Resolve release notes
        shell: pwsh
        run: |
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP `
            "release-notes-$env:RELEASE_VERSION.md"
          & .github/scripts/Get-ReleaseNotes.ps1 `
            -Version $env:RELEASE_VERSION `
            -ChangelogPath CHANGELOG.md `
            -OutputPath $releaseNotesPath
          "RELEASE_NOTES_PATH=$releaseNotesPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore, build, and test
        run: |
          dotnet restore src/Prometheus.slnx `
            -p:RELEASE_VERSION=$env:RELEASE_VERSION
          dotnet build src/Prometheus.slnx -c Release --no-restore `
            -p:RELEASE_VERSION=$env:RELEASE_VERSION
          dotnet test src/Prometheus.slnx -c Release --no-build

      - name: Publish desktop
        shell: pwsh
        run: |
          dotnet publish src/Prometheus/Prometheus.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false `
            -p:RELEASE_VERSION=$env:RELEASE_VERSION `
            -o artifacts/desktop

      - name: Publish updater
        shell: pwsh
        run: |
          dotnet publish src/Prometheus.Updater/Prometheus.Updater.csproj -c Release -r win-x64 `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:RELEASE_VERSION=$env:RELEASE_VERSION `
            -o artifacts/updater

          $updaterPath = Join-Path $env:GITHUB_WORKSPACE `
            'artifacts\updater\Prometheus.Updater.exe'
          if (-not (Test-Path -LiteralPath $updaterPath)) {
            throw "Prometheus.Updater.exe was not produced by the updater publish."
          }
          Copy-Item -LiteralPath $updaterPath `
            -Destination (Join-Path $env:GITHUB_WORKSPACE 'artifacts\desktop')

      - name: Create release package
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null

          $packageName = "Prometheus-$env:RELEASE_VERSION-win-x64.zip"
          $packagePath = Join-Path $outputDirectory $packageName
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts/desktop'),
            $packagePath,
            [IO.Compression.CompressionLevel]::Optimal,
            $false)

          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
          $checksumPath = "$packagePath.sha256"
          $checksumContent = "$($hash.ToLowerInvariant())  $packageName"
          Set-Content -LiteralPath $checksumPath -Value $checksumContent `
            -Encoding ascii -NoNewline
          Write-Host "Created $packageName"
          Write-Host "SHA256: $hash"
          "ZIP_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_CHECKSUM_PATH=$checksumPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build MSI installer
        shell: pwsh
        run: |
          Write-Host "Building MSI version $env:RELEASE_VERSION"

          dotnet clean src/Prometheus.Installer/Prometheus.Installer.wixproj -c Release `
            -p:BuildProjectReferences=false

          dotnet restore src/Prometheus.Installer/Prometheus.Installer.wixproj `
            -p:RELEASE_VERSION=$env:RELEASE_VERSION

          dotnet build src/Prometheus.Installer/Prometheus.Installer.wixproj -c Release `
            --no-restore `
            -p:RELEASE_VERSION=$env:RELEASE_VERSION `
            -p:UseExistingPrometheusPublish=true `
            -p:BuildProjectReferences=false `
            -p:PrometheusPublishDir="$env:GITHUB_WORKSPACE\artifacts\desktop"

          $installerName = "Prometheus-$env:RELEASE_VERSION-win-x64.msi"
          $installerOutputRoot = Join-Path $env:GITHUB_WORKSPACE `
            'src\Prometheus.Installer\bin\Release'
          $builtInstallers = @(
            Get-ChildItem -LiteralPath $installerOutputRoot -Recurse -File `
              -Filter $installerName -ErrorAction SilentlyContinue)
          if ($builtInstallers.Count -ne 1) {
            $availableInstallers = @(
              Get-ChildItem -LiteralPath $installerOutputRoot -Recurse -File `
                -Filter '*.msi' -ErrorAction SilentlyContinue |
                ForEach-Object FullName)
            $availableInstallerText = if ($availableInstallers.Count -eq 0) {
              '<none>'
            }
            else {
              $availableInstallers -join ', '
            }
            throw "Expected one $installerName under $installerOutputRoot, found $($builtInstallers.Count). Available MSI files: $availableInstallerText"
          }
          $builtInstaller = $builtInstallers[0].FullName
          Write-Host "Using built MSI: $builtInstaller"

          $installerPath = Join-Path $env:GITHUB_WORKSPACE "release-output\$installerName"
          Copy-Item -LiteralPath $builtInstaller -Destination $installerPath

          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          Write-Host "Created $installerName"
          Write-Host "SHA256: $hash"
          "MSI_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test MSI installer
        shell: pwsh
        run: |
          & src/Prometheus.Installer/Test-Msi.ps1 -MsiPath $env:MSI_PATH `
            -DesktopShortcut 0 -StartWithWindows 0
          & src/Prometheus.Installer/Test-Msi.ps1 -MsiPath $env:MSI_PATH `
            -DesktopShortcut 1 -StartWithWindows 1 -VerifyRunningApplicationClosure

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:VERSION --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $nativeErrorPreference

          if ($releaseExists) {
            gh release upload $env:VERSION $env:ZIP_PATH $env:ZIP_CHECKSUM_PATH $env:MSI_PATH `
              --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to upload assets for GitHub Release $env:VERSION."
            }

            gh release edit $env:VERSION `
              --repo $env:GITHUB_REPOSITORY `
              --title "Prometheus $env:RELEASE_VERSION" `
              --notes-file $env:RELEASE_NOTES_PATH
          }
          else {
            gh release create $env:VERSION $env:ZIP_PATH $env:ZIP_CHECKSUM_PATH $env:MSI_PATH `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title "Prometheus $env:RELEASE_VERSION" `
              --notes-file $env:RELEASE_NOTES_PATH
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish GitHub Release $env:VERSION."
          }
